services:
  - type: web
    name: eurojackpot-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: uvicorn apps.api.src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
